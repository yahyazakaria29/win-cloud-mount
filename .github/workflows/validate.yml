name: Validate & Lint

on:
  push:
    branches: [ main, develop, feature/**, fix/**, feat/** ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate JSON Schema & Examples
        shell: pwsh
        run: |
          Write-Host "Validating drives.example.json against config/schema.json..."
          $result = Test-Json -Path .\config\drives.example.json -SchemaFile .\config\schema.json
          if (-not $result) {
              Write-Host "::error::drives.example.json does not conform to config/schema.json"
              throw "drives.example.json failed schema validation"
          }
          Write-Host "OK: drives.example.json conforms to config/schema.json."

      - name: Validate PowerShell Script Syntax
        shell: pwsh
        run: |
          $scripts = @(Get-ChildItem -Path .\scripts\ -Filter *.ps1) + @(Get-Item .\install.ps1, .\uninstall.ps1) + @(Get-ChildItem -Path .\tests\ -Filter *.ps1 -ErrorAction SilentlyContinue)
          foreach ($s in $scripts) {
              Write-Host "Parsing syntax for $($s.Name)..."
              $errors = $null
              $null = [System.Management.Automation.Language.Parser]::ParseFile($s.FullName, [ref]$null, [ref]$errors)
              if ($errors) {
                  throw "Syntax error found in $($s.Name): $errors"
              }
              Write-Host "OK: $($s.Name) syntax is valid."
          }

      - name: Run PSScriptAnalyzer Linting
        shell: pwsh
        run: |
          Write-Host "Checking PSScriptAnalyzer module..."
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
              Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck
          }
          Write-Host "Running PSScriptAnalyzer (Severity: Warning, Settings: PSScriptAnalyzerSettings.psd1)..."
          $warnings = @('.\scripts', '.\install.ps1', '.\uninstall.ps1', '.\tests') | ForEach-Object {
              Invoke-ScriptAnalyzer -Path $_ -Recurse -Settings .\PSScriptAnalyzerSettings.psd1 -Severity Warning
          }
          if ($warnings) {
              $warnings | Format-Table -AutoSize
              throw "PSScriptAnalyzer detected $($warnings.Count) warning-level violations."
          }
          Write-Host "OK: PSScriptAnalyzer passed with 0 warnings."

      - name: Run Automated Unit Tests
        shell: pwsh
        run: |
          Write-Host "Running Unit Tests..."
          pwsh -NoProfile -File .\tests\UnitTests.ps1
